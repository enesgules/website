<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f3" />
    <meta name="author" content="Abdullah Enes Gules" />
    <meta
      name="description"
      content="Abdullah Enes Gules is a software engineer at Upstash building Context7."
    />
    <meta
      property="og:title"
      content="Abdullah Enes Gules - Software Engineer"
    />
    <meta
      property="og:description"
      content="Software engineer at Upstash, building Context7."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Enes Gules" />
    <meta property="og:url" id="og-url" />
    <meta property="og:image" id="og-image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Abdullah Enes Gules, Software Engineer, on a softly dithered background."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Abdullah Enes Gules - Software Engineer"
    />
    <meta
      name="twitter:description"
      content="Software engineer at Upstash, building Context7."
    />
    <meta
      name="twitter:image"
      id="twitter-image"
      content="/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="Abdullah Enes Gules, Software Engineer, on a softly dithered background."
    />
    <link rel="canonical" id="canonical-url" />
    <script>
      const siteUrl = `${window.location.origin}/`;
      const socialImageUrl = new URL("/og-image.png", siteUrl).href;

      document
        .getElementById("canonical-url")
        ?.setAttribute("href", siteUrl);
      document.getElementById("og-url")?.setAttribute("content", siteUrl);
      document
        .getElementById("og-image")
        ?.setAttribute("content", socialImageUrl);
      document
        .getElementById("twitter-image")
        ?.setAttribute("content", socialImageUrl);
    </script>
    <link
      rel="preload"
      href="/fonts/archivo-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Abdullah Enes Gules - Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
