<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.35" fill="#111214" opacity=".7"/>
    </pattern>
    <radialGradient id="dot-mask" cx="0" cy="0" r="1" gradientTransform="translate(900 330) rotate(180) scale(620 370)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white"/>
      <stop offset=".72" stop-color="white" stop-opacity=".5"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="fade">
      <rect width="1200" height="630" fill="url(#dot-mask)"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="#e9e9e4"/>
  <rect width="1200" height="630" fill="url(#dots)" mask="url(#fade)" opacity=".82"/>

  <g transform="translate(600 78)">
    <circle r="42" fill="#111214"/>
    <g fill="none" stroke="#e9e9e4" stroke-width="3">
      <circle r="18" stroke-dasharray="1 7" stroke-linecap="round"/>
      <path d="M0-21 20 15H-20Z" stroke-dasharray="1 7" stroke-linecap="round" opacity=".62"/>
      <rect x="-16" y="-16" width="32" height="32" stroke-dasharray="1 7" stroke-linecap="round" opacity=".32"/>
    </g>
  </g>

  <text
    x="600"
    y="360"
    fill="#111214"
    font-family="Arial Black, Helvetica Neue, Arial, sans-serif"
    font-size="178"
    font-weight="900"
    letter-spacing="-16"
    text-anchor="middle"
  >enesgules</text>

  <g fill="#111214" font-family="Helvetica Neue, Arial, sans-serif">
    <text x="54" y="552" font-size="26" font-weight="600" letter-spacing="-1">
      I build Context7 at Upstash.
    </text>
    <text x="54" y="582" font-size="15" font-weight="600" letter-spacing="1.4" opacity=".62">
      SOFTWARE ENGINEER · ISTANBUL
    </text>
    <text x="1146" y="573" font-size="17" font-weight="600" letter-spacing="1.2" text-anchor="end">
      github.com/enesgules
    </text>
  </g>
</svg>
