<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="ordered-dither" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.45" fill="#49566e"/>
    </pattern>
    <radialGradient id="top-right-fade" cx="0" cy="0" r="1" gradientTransform="translate(1100 30) rotate(145) scale(600 360)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".46" stop-color="#fff" stop-opacity=".82"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottom-left-fade" cx="0" cy="0" r="1" gradientTransform="translate(40 620) rotate(-34) scale(540 320)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".42" stop-color="#fff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="edge-dither">
      <rect width="1200" height="630" fill="#000"/>
      <rect width="1200" height="630" fill="url(#top-right-fade)"/>
      <rect width="1200" height="630" fill="url(#bottom-left-fade)"/>
    </mask>
    <linearGradient id="paper-veil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f6f3" stop-opacity=".35"/>
      <stop offset=".25" stop-color="#f6f6f3" stop-opacity=".94"/>
      <stop offset=".72" stop-color="#f6f6f3" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f6f6f3" stop-opacity=".25"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#f6f6f3"/>
  <rect width="1200" height="630" fill="url(#ordered-dither)" mask="url(#edge-dither)" opacity=".7"/>
  <rect x="120" width="960" height="630" fill="url(#paper-veil)"/>

  <g transform="translate(170 150)">
    <g fill="#171815" font-family="Arial, Helvetica, sans-serif">
      <text x="0" y="54" font-size="58" font-weight="700" letter-spacing="-2.6">
        Abdullah Enes Gules
      </text>
      <text x="0" y="102" fill="#74756f" font-size="32" font-weight="400" letter-spacing="-.8">
        Software Engineer
      </text>
    </g>

    <g transform="translate(566 0)">
      <rect width="102" height="102" rx="16" fill="#f6f6f3"/>
      <rect x=".75" y=".75" width="100.5" height="100.5" rx="15.25" fill="none" stroke="#171815" stroke-opacity=".12" stroke-width="1.5"/>
      <g fill="#171815" transform="translate(3 3) scale(3)">
        <circle cx="4" cy="4" r=".8"/>
        <circle cx="12" cy="4" r="2.15"/>
        <circle cx="20" cy="4" r="1.05"/>
        <circle cx="28" cy="4" r="2.65"/>
        <circle cx="4" cy="12" r="2.9"/>
        <circle cx="12" cy="12" r="1.35"/>
        <circle cx="20" cy="12" r="3.15"/>
        <circle cx="28" cy="12" r="1.7"/>
        <circle cx="4" cy="20" r="1.15"/>
        <circle cx="12" cy="20" r="2.75"/>
        <circle cx="20" cy="20" r=".65"/>
        <circle cx="28" cy="20" r="2.25"/>
        <circle cx="4" cy="28" r="3.2"/>
        <circle cx="12" cy="28" r="1.8"/>
        <circle cx="20" cy="28" r="2.85"/>
        <circle cx="28" cy="28" r="1.25"/>
      </g>
    </g>

    <g transform="translate(0 210)" font-family="Arial, Helvetica, sans-serif">
      <text x="0" y="0" fill="#171815" font-size="18" font-weight="700">Today</text>
      <line x1="0" y1="28" x2="860" y2="28" stroke="#171815" stroke-opacity=".12"/>
      <text x="0" y="86" fill="#171815" font-size="30" font-weight="400" letter-spacing="-.65">
        I build Context7 at Upstash.
      </text>
      <text x="0" y="128" fill="#74756f" font-size="22" font-weight="400" letter-spacing="-.25">
        Open-source tools and interactive ways to explain technical ideas.
      </text>
    </g>

    <g transform="translate(0 404)" fill="#666861" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">
      <text x="0" y="0">Context7</text>
      <circle cx="86" cy="-5" r="2" fill="#a3a49e"/>
      <text x="104" y="0">Hugeicons Animated</text>
      <circle cx="265" cy="-5" r="2" fill="#a3a49e"/>
      <text x="283" y="0">Distributed Concepts</text>
      <circle cx="458" cy="-5" r="2" fill="#a3a49e"/>
      <text x="476" y="0">DKT Materyal</text>
    </g>
  </g>
</svg>
